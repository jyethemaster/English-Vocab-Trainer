/* ===== MASCOT / CHARACTER SYSTEM ===== */
#buddy{position:relative;display:grid;grid-template-columns:86px 1fr;gap:12px;align-items:center;margin:0 0 12px;padding:12px 14px;border:1px solid var(--bd);border-radius:22px;background:linear-gradient(135deg,color-mix(in srgb,var(--card) 94%,var(--ac) 6%),var(--card));box-shadow:var(--shadow2);overflow:hidden}

/* ===== XP COSMETICS SHOP ===== */

<script>
/* DATA: De finale Wordenlijst, unit 1-8 (word=English gloss, ^ = de, ~ = het) */

function faceSVG(state,st,eye){

  const sad=state==="sad";
  const mouth=happy?`<path d="M43 67Q50 76 57 67" fill="none" stroke="${eye}" stroke-width="3" stroke-linecap="round"/>`
    :sad?`<path d="M43 72Q50 64 57 72" fill="none" stroke="${eye}" stroke-width="3" stroke-linecap="round"/>`
    :`<path d="M44 68Q50 71 56 68" fill="none" stroke="${eye}" stroke-width="2.8" stroke-linecap="round"/>`;

}

 const cellsOf=w=>[...w.w].map((_,i)=>[w.r+(w.d?i:0),w.c+(w.d?0:i)]);
 WD.forEach(w=>cellsOf(w).forEach(([a,b],i)=>sol[a][b]=w.w[i]));
 let n=0;for(let a=0;a<R;a++)for(let b=0;b<C;b++){const st=WD.filter(w=>w.r==a&&w.c==b);if(st.length){n++;num[a+","+b]=n;st.forEach(w=>w.n=n)}}
 let sel={r:WD[0].r,c:WD[0].c},dir=WD[0].d,chk=false,over=false,fm="";
 const wordAt=(a,b,d)=>WD.find(w=>w.d==d&&(d?w.c==b&&a>=w.r&&a<w.r+w.w.length:w.r==a&&b>=w.c&&b<w.c+w.w.length));
 const aw=()=>wordAt(sel.r,sel.c,dir)||(dir=1-dir,wordAt(sel.r,sel.c,dir));

 h(`<div class="sc"><span>Crossword · ${WD.length} words</span>${chSel()}</div>${tbar()}<div id="xb" class="msg"></div>
 <div class="xg" style="grid-template-columns:repeat(${C},1fr);max-width:${C*36}px">${sol.map((row,a)=>row.map((v,b)=>v?`<div class="xc" id="x${a}_${b}" data-r="${a}" data-c="${b}">${num[a+","+b]?`<i>${num[a+","+b]}</i>`:""}<b></b></div>`:'<div class="xe"></div>').join("")).join("")}</div>
 <div class="row"><button class="b" id="xk">Check</button><button class="b" id="xh">Reveal letter (−3 XP)</button><button class="b" id="xn">New puzzle</button></div><div id="xe"></div>
 <div class="sc" style="margin-top:12px"><b>Across →</b></div>${ac.map(cl).join("")}<div class="sc" style="margin-top:8px"><b>Down ↓</b></div>${dn.map(cl).join("")}
 <input id="cx" class="hid" value="·" autocomplete="off" autocapitalize="off" spellcheck="false">`);
 bindCh();const cx=document.getElementById("cx"),foc=()=>{cx.focus();cx.value="·"};
 function paint(){
  const a=aw(),set=new Set(cellsOf(a).map(x=>x.join()));
  for(let i=0;i<R;i++)for(let j=0;j<C;j++)if(sol[i][j]){const e=document.getElementById("x"+i+"_"+j);e.querySelector("b").textContent=u[i][j];e.className="xc"+(sel.r==i&&sel.c==j?" xs":set.has(i+","+j)?" xa":"")+(chk&&u[i][j]&&u[i][j]!=sol[i][j]?" xw":"")+(rev[i][j]?" xr":"")}

  if(over||lock[i][j])return;u[i][j]=v;chk=false;if(hint)hn[i][j]=lock[i][j]=1;
  WD.filter(w=>cellsOf(w).some(x=>x[0]==i&&x[1]==j)).forEach(w=>{const cs=cellsOf(w);if(!w.done&&cs.every(x=>u[x[0]][x[1]]==sol[x[0]][x[1]])){w.done=1;if(!cs.some(x=>hn[x[0]][x[1]])){good(6);rec("v:"+w.w,1)}cs.forEach(x=>lock[x[0]][x[1]]=1)}});
  if(WD.every(w=>w.done))finish(true)}
 function finish(win){
  if(over)return;over=true;tstop();
  if(win){const x=good(15+WD.length*2);won();fm="🎉 Done! +"+x+" XP"}
  else{bad();fm="⏰ Time is up!";for(let i=0;i<R;i++)for(let j=0;j<C;j++)if(sol[i][j]&&u[i][j]!=sol[i][j]){u[i][j]=sol[i][j];rev[i][j]=1}}
  document.getElementById("xe").innerHTML=`<div class="sc" style="margin-top:10px"><b>Tick words you already know</b></div>`+WD.map(w=>`<label class="it"><span>${w.w} = ${esc(w.en)}</span><input type="checkbox" data-k="v:${w.w}" ${PG.kn["v:"+w.w]?"checked":""} style="width:auto;margin:0"></label>`).join("");
  app.querySelectorAll("#xe [data-k]").forEach(c=>c.onchange=()=>{if(c.checked)PG.kn[c.dataset.k]=1;else delete PG.kn[c.dataset.k];savePG()});paint()}
 const step=d=>{const cs=cellsOf(aw()),i=cs.findIndex(x=>x[0]==sel.r&&x[1]==sel.c),k=cs[i+d];if(k)sel={r:k[0],c:k[1]};return !!k};
 cx.oninput=e=>{const L=cx.value.toLowerCase().replace(/[^a-z]/g,"").slice(-1),del=!L&&(!cx.value||(e.inputType||"").startsWith("delete"));cx.value="·";if(over)return;
  if(L){setCh(sel.r,sel.c,L);step(1)}
  else if(del){if(u[sel.r][sel.c]&&!lock[sel.r][sel.c]){u[sel.r][sel.c]="";chk=false}else if(step(-1)&&!lock[sel.r][sel.c]){u[sel.r][sel.c]="";chk=false}}
  paint()};
 app.querySelectorAll(".xc").forEach(e=>e.onclick=()=>{const a=+e.dataset.r,b=+e.dataset.c;if(sel.r==a&&sel.c==b){if(wordAt(a,b,1-dir))dir=1-dir}else{sel={r:a,c:b};if(!wordAt(a,b,dir))dir=1-dir}foc();paint()});
 app.querySelectorAll("[data-w]").forEach(e=>e.onclick=()=>{const w=WD[+e.dataset.w],f=cellsOf(w).find(x=>!u[x[0]][x[1]])||cellsOf(w)[0];sel={r:f[0],c:f[1]};dir=w.d;foc();paint()});
 document.getElementById("xk").onclick=()=>{if(over)return;chk=true;const bw=WD.filter(w=>!w.done&&cellsOf(w).some(x=>u[x[0]][x[1]]&&u[x[0]][x[1]]!=sol[x[0]][x[1]]));if(bw.length){bad();bw.forEach(w=>rec("v:"+w.w,0))}else toast("Everything you filled in is correct ✓");paint()};
 document.getElementById("xh").onclick=()=>{if(over||lock[sel.r][sel.c])return;G.xp=Math.max(0,G.xp-3);const g=gs(cur);g.xp=Math.max(0,g.xp-3);save();hdr();toast("−3 XP");setCh(sel.r,sel.c,sol[sel.r][sel.c],1);step(1);paint()};
 document.getElementById("xn").onclick=xw;
 if(TS())tstart(TS()*WD.length*4,()=>finish(false));

}

function wr(){
 tstop();
 const cand=pool(VOC).filter(x=>EN[x.w]&&x.w.length>=3&&x.w.length<=14);
 if(cand.length<4){h(`<div class="sc"><span>Word Rain</span>${chSel()}</div><div class="msg">Too few words here. Choose “All units”.</div>`);bindCh();return}
 let lives=3,score=0,cleared=0,over=false,words=[],missed=[],sp=0;const H=320,base=[16,20,16,12][T];
 h(`<div class="sc"><span id="rl"></span><span id="rs"></span>${chSel()}</div>
 <div class="ar" id="ar"><div class="ov" id="ov"><div>Type the English word before it hits the ground.</div><button class="b" id="st">▶ Start</button></div></div>
 <input id="ri" placeholder="Type the English word…" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" style="margin-top:10px;font-size:16px">
 <div class="msg" id="rm"></div><div class="row"><button class="b" id="rn">Again</button></div>`);
 bindCh();const ar=document.getElementById("ar"),ri=document.getElementById("ri"),rm=document.getElementById("rm");
 const lvl=()=>1+(cleared/5|0),upd=()=>{document.getElementById("rl").textContent="❤️".repeat(Math.max(0,lives));document.getElementById("rs").textContent="Score: "+score+" · Speed "+lvl()};
 function spawn(){
  if(words.length>=7)return;let o,t=0;do{o=pick(cand);t++}while(words.some(x=>x.w==o.w)&&t<8);if(words.some(x=>x.w==o.w))return;
  const el=document.createElement("div");el.className="fw";el.textContent=EN[o.w]+" ("+o.w.length+")";ar.appendChild(el);
  el.style.left=Math.random()*Math.max(0,ar.clientWidth-el.offsetWidth)+"px";el.style.top="0px";words.push({w:o.w,en:EN[o.w],y:0,el})}
 function miss(w){words.splice(words.indexOf(w),1);w.el.remove();lives--;bad();rec("v:"+w.w,0);if(!missed.some(m=>m.w==w.w))missed.push(w);rm.textContent="✗ "+w.w+" = "+w.en;upd();if(lives<=0)end()}
 function hit(w){words.splice(words.indexOf(w),1);w.el.remove();score++;cleared++;good(8);rec("v:"+w.w,1);ri.value="";rm.textContent="✓ "+w.w;upd();if(cleared%5==0)toast("⚡ Fastler!")}
 function end(){
  over=true;tstop();if(score>(G.wb||0)){G.wb=score;save()}if(score>=10)won();
  ar.insertAdjacentHTML("beforeend",`<div class="ov">${sOver()||""}<div class="big">💀</div><b>Game over</b><div>Score: ${score} · Record: ${G.wb||0}</div></div>`);
  rm.innerHTML=missed.length?`<div class="sc" style="justify-content:center">Missed:</div>`+missed.map(m=>`<div class="it"><span>${esc(m.w)}</span><span>${esc(m.en)}</span></div>`).join(""):""}
 function tick(){

  const dy=H/(Math.max(4,base-lvl()*.7)*20);
  [...words].forEach(w=>{w.y+=dy;w.el.style.top=w.y+"px";if(w.y>=H-30&&!over)miss(w)})}
 ri.oninput=()=>{if(over)return;const nz=z=>z.normalize("NFD").replace(/[\u0300-\u036f]/g,""),v=nz(ri.value.trim().toLowerCase()),m=words.find(x=>nz(x.w)==v);if(m&&v){hit(m);return}words.forEach(x=>x.el.classList.toggle("hl",!!v&&nz(x.w).startsWith(v)))};
 ri.onkeydown=e=>{if(e.key=="Enter")ri.value=""};
 document.getElementById("st").onclick=()=>{document.getElementById("ov").remove();spawn();TM.id=setInterval(tick,50);ri.focus()};
 document.getElementById("rn").onclick=wr;upd();
}

let MY={v:[],p:[],i:[],sy:[],ov:{}},mt="v",mmsg="",edq="";
try{MY=Object.assign(MY,JSON.parse(localStorage.getItem("et_my")||"{}"))}catch(e){}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function rebuild(){
 [VOC,PR,IDI,ALL,SYN].forEach(a=>{for(let i=a.length-1;i>=0;i--)if(a[i].my)a.splice(i,1)});
 if(!rebuild.b)rebuild.b={...EN};for(const k in EN)if(!(k in rebuild.b))delete EN[k];Object.assign(EN,rebuild.b);
 MY.v.forEach(x=>{VOC.push({w:x.w,c:9,my:1,a:x.a||undefined});EN[x.w]=x.en+(x.a?" · "+x.a:"");if(x.s)ALL.push({s:x.s,c:7,w:x.w,my:1})});
 MY.p.forEach(x=>PR.push({t:x.t,p:x.p,c:9,my:1}));
 MY.i.forEach(x=>IDI.push({t:x.t,m:x.m,c:9,my:1}));
 MY.sy.forEach(x=>SYN.push({w:x.w,y:x.y,c:9,my:1}));
 for(const k in MY.ov){const v=VOC.find(x=>x.w==k);if(v)EN[k]=MY.ov[k]+(v.a?" · "+v.a:"")}
}
function addRow(a){a=a.map(x=>(x||"").trim());if(!a[0]||!a[1])return 0;
 if(mt=="v"){let w=a[0].toLowerCase(),ar=(a[2]||"").toLowerCase(),s=a[3]||"";
  const m=w.match(/^(a|an)\s+(\S.*)$/)||w.match(/^([\^~])\s*(\S.*)$/);if(m){w=m[2];if(!ar)ar=m[1]}
  ar=ar.toLowerCase();if(ar!="a"&&ar!="an")ar="";
  const o=MY.v.find(x=>x.w==w);if(o){o.en=a[1];if(ar)o.a=ar;if(s)o.s=s}else MY.v.push({w,en:a[1],s,a:ar})}
 else if(mt=="p")MY.p.push({t:a[0],p:a[1].toLowerCase()});
 else if(mt=="s")MY.sy.push({w:a[0].toLowerCase(),y:a[1].split(/[\/,]/).map(x=>x.trim().toLowerCase()).filter(Boolean)});
 else MY.i.push({t:a[0],m:a[1]});return 1}
function persist(){try{localStorage.setItem("et_my",JSON.stringify(MY))}catch(e){}rebuild()}
function mine(){
 const L={v:["English word","Japanese 日本語","Article: a or an (optional)","Example sentence (optional)"],p:["Verb (e.g. wait)","Preposition (e.g. for)"],i:["Idiom","Meaning"],s:["Word","Synoniem(en), gescheiden door /"]}[mt];

 h(`<div class="sc"><span>My list: ${MY.v.length} words · ${MY.p.length} prepositions · ${MY.i.length} phrases · ${MY.sy.length} synoniemen</span></div>
 <div class="sc">Your words appear under “All units” and “My Words” in every game.</div>

 ${L.map((x,n)=>`<input id="f${n}" placeholder="${x}">`).join("")}

 <textarea id="bulk" placeholder="Several at once, one per line, separated by =  (e.g. hesitate = ためらう  or  a policy = 政策)"></textarea>
 <div class="row" style="margin:0 0 6px"><button class="b" id="bk">Add list</button></div>
 <div class="msg">${mmsg}</div>
 <div>${MY[mt=="s"?"sy":mt].map((x,n)=>`<div class="it"><span>${show(x)}</span><button class="b" data-d="${n}">✕</button></div>`).join("")}</div>
 <div class="sc" style="margin-top:14px"><b>Edit meanings</b></div><input id="eds" placeholder="Search a word or meaning…" value="${esc(edq)}"><div id="edl"></div>
 <textarea id="bak" style="margin-top:12px" placeholder="Backup: Export to copy, paste here and click Import on another device"></textarea>
 <div class="row" style="margin-top:0"><button class="b" id="ex">Export</button><button class="b" id="im">Import</button></div>`);
 const sel=document.getElementById("mt");sel.value=mt;sel.onchange=()=>{mt=sel.value;mmsg="";mine()};
 document.getElementById("add").onclick=()=>{const ok=addRow(L.map((_,n)=>document.getElementById("f"+n).value));mmsg=ok?"✓ Toegevoegd":"Fill in at least the first two fields.";persist();mine()};
 document.getElementById("bk").onclick=()=>{let n=0;document.getElementById("bulk").value.split("\n").forEach(l=>{let q=l.split("=");if(mt=="v"&&q.length>=3&&!/^\s*(a|an|\^|~)\s*$/i.test(q[2]))q=[q[0],q[1],"",q.slice(2).join("=")];n+=addRow(q)});mmsg="✓ "+n+" added";persist();mine()};
 app.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{MY[mt=="s"?"sy":mt].splice(+b.dataset.d,1);persist();mine()});
 document.getElementById("ex").onclick=()=>{const t=JSON.stringify({...MY,pg:PG,gx:G.gx,xp:G.xp,spent:G.spent,shop:G.shop});document.getElementById("bak").value=t;try{navigator.clipboard.writeText(t)}catch(e){}};
 document.getElementById("im").onclick=()=>{try{const o=JSON.parse(document.getElementById("bak").value);["v","p","i","sy"].forEach(k=>(Array.isArray(o[k])?o[k]:[]).forEach(x=>{if(x&&typeof x=="object"&&!MY[k].some(y=>JSON.stringify(y)==JSON.stringify(x)))MY[k].push(x)}));if(o.ov&&typeof o.ov=="object")Object.assign(MY.ov,o.ov);if(o.pg){Object.assign(PG.kn,o.pg.kn||{});for(const k in o.pg.st||{}){const a=PG.st[k],b=o.pg.st[k];if(!a||b.c+b.w>a.c+a.w)PG.st[k]=b}savePG()}if(o.gx){for(const k in o.gx){if(!G.gx[k]||o.gx[k].xp>G.gx[k].xp)G.gx[k]=o.gx[k]}if(o.xp>G.xp)G.xp=o.xp;if(typeof o.spent==="number"&&o.spent<G.spent)G.spent=o.spent;if(o.shop&&Array.isArray(o.shop.owned)){G.shop.owned=[...new Set([...(G.shop.owned||[]),...o.shop.owned])];G.shop.equipped=Object.assign(G.shop.equipped||{},o.shop.equipped||{})}save();hdr();applyCharacter()}mmsg="✓ Imported"}catch(e){mmsg="Invalid backup."}persist();mine()};

}
